[project]
name = "traffic-lpr-runtime"
version = "0.1.0"
description = "Independent local runtime for Traffic license plate recognition"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "einops>=0.8.0",
    "fast-alpr[onnx-gpu]>=0.4.0",
    "huggingface-hub>=0.24.0",
    "numpy>=2.2.0",
    "opencv-python>=4.10.0",
    "pyzipper>=0.3.6",
    "remotezip>=0.12.3",
    "timm>=1.0.0",
    "ultralytics>=8.4.0",
]

[project.scripts]
traffic-lpr-runtime = "traffic_lpr_runtime.entrypoints.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["traffic_lpr_runtime*"]