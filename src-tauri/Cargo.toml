[package]
name = "traffic-reporter"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "traffic-reporter"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1.20.0", features = ["v4"] }
chrono = "0.4"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
specta-typescript = "=0.0.12"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
eventsource-stream = "0.2"
futures-util = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
